[package]
org = "ores-wasm-loaders"
name = "owls-interfaces"
version = "0.1.1"
description = "Release manifests and host contracts for shared WASM loaders"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/ores-wasm-loaders/owls-interfaces"

[dependencies]
"oresoftware/typespec-json-schema-validator" = "^0.1.0"
"oresoftware/api-docs" = "^2.0.2"

[targets.repository]
dir = "."

[install]
dir = ".vendor/.zed"
adapter = "none"

[publish]
include_readme = true
exclude = [".ores/**", ".zed/**", ".zed-pack/**", ".vendor/**", "zed_modules/**", "node_modules/**", "**/target/**", "**/.dart_tool/**", "**/build/**"]
