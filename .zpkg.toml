[package]
org = "ores-wasm-loaders"
name = "owls-interfaces"
version = "0.1.0"
description = "Release manifests and host contracts for shared WASM loaders"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/ores-wasm-loaders/owls-interfaces"

[targets.repository]
dir = "."
[install]
adapter = "none"
[publish]
exclude = [".ores/**", ".zed/**", ".zed-pack/**", "zed_modules/**", "node_modules/**", "**/target/**", "**/.dart_tool/**", "**/build/**"]

