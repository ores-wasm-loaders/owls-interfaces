name: contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run release contract and browser-entry tests
        run: node --test test/*.test.mjs

  peer-authority-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate comparison-only Schema B and compare both authorities
        uses: ORESoftware/typespec-json-schema-validator@3822508a667d36f9e094f84aa57b1b2944230852
        with:
          typespec: contracts/main.tsp
          schema: schemas/release.schema.json
          report: .typespec-json-schema-validator/report.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: '96'
      - name: Preserve parity receipt and generated comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typespec-json-schema-parity
          path: .typespec-json-schema-validator/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
