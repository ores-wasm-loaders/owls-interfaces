name: ores-cli repository governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out immutable ores-cli source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: 2a832ce10e74129ddf9577fc0fff40e8da40a38c
          path: .tools/ores-cli
          persist-credentials: false

      - name: Install immutable ores-cli toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./.tools/ores-cli/post-install.sh --install-root "$RUNNER_TEMP/ores-cli"
          echo "$RUNNER_TEMP/ores-cli/bin" >> "$GITHUB_PATH"

      - name: Audit repository policy and peer-authority layout
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ores-cli/bin/oresc" --no-json audit repo --path "$GITHUB_WORKSPACE" --profile baseline

      - name: Prove TypeSpec and JSON Schema remain independent authorities
        shell: bash
        run: |
          set -euo pipefail
          test -f contracts/config.tsp
          test -f schemas/ores-wasm-config.schema.json
          test -f test/fixtures/schema-authority-canary/main.tsp
          test -f test/fixtures/schema-authority-canary/authored.schema.json
          test ! -e test/fixtures/schema-authority-canary/typespec.generated.schema.json
